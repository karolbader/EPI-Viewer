[package]
name = "epi-viewer"
version = "0.1.0"
edition = "2021"
description = "EPI Viewer (local-only pack inspector)"
license = "UNLICENSED"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1.0"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
ed25519-dalek = "2.2.0"
hex = "0.4"
pulldown-cmark = "0.13"
rand_core = { version = "0.6", features = ["getrandom"] }
rfd = "0.15"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tauri = { version = "2", features = [] }
tempfile = "3.13"
walkdir = "2.5"
zip = { version = "2.4.2", default-features = false, features = ["deflate"] }
